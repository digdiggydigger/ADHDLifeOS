# Default ruleset. Adjustments below are flagged exceptions, not blanket disables.

# Xcode auto-generates these type names from the project name ("ADHD LifeOS" -> "ADHD_LifeOS...")
# for the @main app struct and the default test-target scaffolding it creates on `File > New`.
# Renaming them would mean renaming the app target/scheme itself, which is an Xcode-GUI step
# (out of scope for a Swift-source-only lint fix) rather than an actual naming quality issue.
type_name:
  excluded:
    - ADHD_LifeOSApp
    - ADHD_LifeOSTests
    - ADHD_LifeOSUITests
    - ADHD_LifeOSUITestsLaunchTests

# p1-p4 mirror the web app's TaskPriority literal union ('p1' | 'p2' | 'p3' | 'p4') exactly —
# a longer name here would break behavioral/naming parity with web for no real clarity gain.
# `id` is restated here because setting `excluded` replaces (not appends to) SwiftLint's
# built-in default rather than merging with it.
identifier_name:
  excluded:
    - id
    - p1
    - p2
    - p3
    - p4

# `CLAUDE.md` §4: every colour goes through the design-token layer (asset colorsets), never a raw
# SwiftUI hue. This is a LINT rule rather than a convention because the convention already failed
# silently — `CaptureKindAccent` kept its own `.orange`/`.purple`/`.blue` table for months, and it
# only surfaced when E spotted an inbox row disagreeing with the triage card above it (2026-08-27).
#
# Semantic colours (`.primary`, `.secondary`, `.accentColor`, `.white`, `.black`, `.clear`) are
# NOT hues and stay allowed — §4 explicitly endorses them.
custom_rules:
  raw_hue_color:
    name: "Raw hue colour"
    message: "Use a design token (Color(\"StateGo\") / Color(\"StateWarn\") / Color(\"StateRisk\") / an Area* token) rather than a raw SwiftUI hue — CLAUDE.md §4."
    regex: '(foregroundStyle|fill|tint|background|stroke|strokeBorder)\(\s*\.(orange|purple|green|blue|red|yellow|pink|indigo|teal|mint|brown|cyan)\s*\)|Color\.(orange|purple|green|blue|red|yellow|pink|indigo|teal|mint|brown|cyan)\b'
    severity: warning
